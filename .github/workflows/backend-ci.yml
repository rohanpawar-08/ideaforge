name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Backend Test Suite
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: .

    env:
      APP_ENV: testing
      SECRET_KEY: test_secret_key_at_least_32_characters_long_for_security_ci
      DATABASE_URL: sqlite:///./ci_test.db
      CORS_ORIGINS: http://localhost:5173,https://ideaforge-steel-alpha.vercel.app
      GROQ_API_KEY: mock_ci_groq_key_do_not_use_real
      LLM_PROVIDER: groq
      LLM_MODEL: llama-3.3-70b-versatile
      RENDER: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          if [ -f backend/requirements-dev.txt ]; then pip install -r backend/requirements-dev.txt; fi

      - name: Run Release Safety Pre-Flight Check
        run: |
          python backend/release_check.py

      - name: Prepare CI test database
        run: |
          rm -f ci_test.db
          python -m alembic -c backend/alembic.ini upgrade head
          python -m alembic -c backend/alembic.ini current

      - name: Run Security Hardening Tests
        run: |
          python backend/test_security_hardening.py

      - name: Run Database Hardening Tests
        run: |
          python backend/test_database_hardening.py

      - name: Run Auth & Account Lifecycle Tests
        run: |
          python backend/test_auth_product_features.py

      - name: Run Blueprint V2 Tests
        run: |
          python backend/test_blueprint_v2.py

      - name: Run AI Reliability & Usage Quota Tests
        run: |
          python backend/test_ai_reliability.py

      - name: Run Project Workspace Tests
        run: |
          python backend/test_project_workspace.py
