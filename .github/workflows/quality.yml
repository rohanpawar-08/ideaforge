name: Quality & Migration Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-quality:
    name: Python Compilation & Alembic Drift Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          if [ -f backend/requirements-dev.txt ]; then pip install -r backend/requirements-dev.txt; fi

      - name: Verify dependency tree sanity
        run: python -m pip check

      - name: Check Python compilation syntax
        run: |
          python -m py_compile backend/*.py backend/services/*.py backend/alembic/*.py backend/alembic/versions/*.py

      - name: Verify Alembic single head and schema drift
        run: |
          python backend/release_check.py
